# =============================================================================
#  Nav2 parameters for the AMR  (ROS 2 Humble)
#  Differential drive, r = 0.056 m, wheel separation = 0.39 m, single 2D LiDAR,
#  running on a Raspberry Pi. Odometry from ros2_control diff_drive_controller.
#
#  >>> Values marked  # EDIT  must be checked for YOUR robot before the first run
#      (footprint, LiDAR range, odom topic). See README section 4.
# =============================================================================

# -----------------------------------------------------------------------------
# AMCL: localization on a saved map (used only by nav_map.launch.py)
# -----------------------------------------------------------------------------
amcl:
  ros__parameters:
    use_sim_time: false
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    global_frame_id: "map"
    odom_frame_id: "odom"
    base_frame_id: "base_link"
    scan_topic: scan
    tf_broadcast: true
    transform_tolerance: 0.5          # generous: odom arrives over Wi-Fi
    # Odometry noise model (how much AMCL distrusts odom). Raise if odom is poor.
    alpha1: 0.2                       # rotation noise from rotation
    alpha2: 0.2                       # rotation noise from translation
    alpha3: 0.2                       # translation noise from translation
    alpha4: 0.2                       # translation noise from rotation
    alpha5: 0.2
    # Laser model
    laser_model_type: "likelihood_field"
    laser_max_range: 8.0              # EDIT: real max range of your LiDAR (LD14 ~8 m, RPLIDAR A1 ~12 m)
    laser_min_range: 0.1
    laser_likelihood_max_dist: 2.0
    max_beams: 60
    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    sigma_hit: 0.2
    lambda_short: 0.1
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9
    # Particle filter (lower than Nav2 default to save Pi CPU)
    max_particles: 1500
    min_particles: 300
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    update_min_d: 0.15                # run filter after 15 cm ...
    update_min_a: 0.2                 # ... or 0.2 rad of motion
    save_pose_rate: 0.5
    set_initial_pose: false           # give it with "2D Pose Estimate" in RViz
    initial_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}

# -----------------------------------------------------------------------------
# BT Navigator: the "brain" (behavior tree). Default Humble trees are used.
# plugin_lib_names is intentionally omitted -> Humble's built-in default list.
# -----------------------------------------------------------------------------
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /diff_drive_controller/odom   # EDIT if your odom topic differs
    bt_loop_duration: 10
    default_server_timeout: 20
    transform_tolerance: 0.3

# -----------------------------------------------------------------------------
# Controller server: follows the path, outputs velocity (-> velocity smoother)
# Regulated Pure Pursuit: simple, smooth, light on the Pi.
# -----------------------------------------------------------------------------
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0                # Hz
    odom_topic: /diff_drive_controller/odom   # EDIT if your odom topic differs
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3           # must move 30 cm ...
      movement_time_allowance: 15.0           # ... within 15 s, else recovery

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.15                 # m
      yaw_goal_tolerance: 0.25                # rad (~15 deg)

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.25                # m/s cruise speed (start slow)
      lookahead_dist: 0.5
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.8
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.3
      # turn in place towards the path when heading error is large
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.8      # rad/s
      rotate_to_heading_min_angle: 0.785      # rad (45 deg)
      max_angular_accel: 1.5                  # rad/s^2
      allow_reversing: false
      # slow down on tight curves and near obstacles
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.1
      cost_scaling_dist: 0.4
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0      # MUST equal inflation_layer.cost_scaling_factor
      # slow down when approaching the goal
      approach_velocity_scaling_dist: 0.6
      min_approach_linear_velocity: 0.05
      # stop if a collision is predicted
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      max_robot_pose_search_dist: 10.0
      use_interpolation: true

# -----------------------------------------------------------------------------
# LOCAL COSTMAP: small rolling window around the robot, live LiDAR obstacles
# -----------------------------------------------------------------------------
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom                # smooth frame, no SLAM jumps
      robot_base_frame: base_link
      rolling_window: true
      width: 3                          # m
      height: 3                         # m
      resolution: 0.05                  # m per cell
      update_frequency: 5.0             # Hz
      publish_frequency: 2.0            # Hz (RViz only)
      transform_tolerance: 0.3
      # EDIT: robot outline relative to base_link (x forward, y left), metres.
      # Placeholder = 0.50 m long x 0.46 m wide, centred on base_link.
      footprint: "[[0.25, 0.23], [0.25, -0.23], [-0.25, -0.23], [-0.25, 0.23]]"
      footprint_padding: 0.02
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          obstacle_max_range: 2.5       # mark obstacles up to 2.5 m
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0       # clear up to 3 m (>= obstacle_max_range)
          raytrace_min_range: 0.0
          inf_is_valid: false

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.40          # m; lower to 0.30 if doorways look blocked
        cost_scaling_factor: 3.0

      always_send_full_costmap: true

# -----------------------------------------------------------------------------
# GLOBAL COSTMAP: whole map, used for path planning
# -----------------------------------------------------------------------------
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 1.0
      publish_frequency: 1.0
      resolution: 0.05
      transform_tolerance: 0.3
      track_unknown_space: true
      footprint: "[[0.25, 0.23], [0.25, -0.23], [-0.25, -0.23], [-0.25, 0.23]]"   # EDIT: same as local
      footprint_padding: 0.02
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          inf_is_valid: false

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.40
        cost_scaling_factor: 3.0

      always_send_full_costmap: true

# -----------------------------------------------------------------------------
# Map server / saver (map path is filled in by the launch file)
# -----------------------------------------------------------------------------
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

# -----------------------------------------------------------------------------
# Planner server: global path on the global costmap
# -----------------------------------------------------------------------------
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

# -----------------------------------------------------------------------------
# Smoother server: smooths the planned path
# -----------------------------------------------------------------------------
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

# -----------------------------------------------------------------------------
# Behavior server: recoveries (spin, back up, wait)
# -----------------------------------------------------------------------------
behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.3
    rotational_acc_lim: 1.5

# -----------------------------------------------------------------------------
# Waypoint follower: multi-goal missions
# -----------------------------------------------------------------------------
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200     # ms

# -----------------------------------------------------------------------------
# Velocity smoother: limits acceleration of the final /cmd_vel
# (controller -> cmd_vel_nav -> smoother -> /cmd_vel -> relay -> diff_drive_controller)
# -----------------------------------------------------------------------------
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.25, 0.0, 1.0]      # [vx m/s, vy, wz rad/s]
    min_velocity: [-0.15, 0.0, -1.0]
    max_accel: [0.5, 0.0, 1.5]
    max_decel: [-0.5, 0.0, -1.5]
    odom_topic: /diff_drive_controller/odom   # EDIT if your odom topic differs (only used in CLOSED_LOOP)
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
